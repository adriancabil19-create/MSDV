services:
  web:
    build: .
    container_name: msdv_app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      - DB_TYPE=${DB_TYPE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    depends_on:
      - postgres
    networks:
      - msdv_network

  postgres:
    image: postgres:15-alpine
    container_name: msdv_postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/mcc_discipline_system.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - msdv_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  msdv_network:
    driver: bridge

volumes:
  postgres_data:
