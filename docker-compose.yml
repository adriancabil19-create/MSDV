version: '3.8'

services:
  web:
    build: .
    container_name: msdv_app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_TYPE=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=msdv_user
      - DB_PASS=msdv_password
      - DB_NAME=mcc_discipline_system
    depends_on:
      - postgres
    networks:
      - msdv_network

  postgres:
    image: postgres:15-alpine
    container_name: msdv_postgres
    environment:
      - POSTGRES_USER=msdv_user
      - POSTGRES_PASSWORD=msdv_password
      - POSTGRES_DB=mcc_discipline_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/mcc_discipline_system.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - msdv_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msdv_user"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  msdv_network:
    driver: bridge

volumes:
  postgres_data:
